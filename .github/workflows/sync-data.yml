name: Sincronizar banco de preguntas

on:
  push:
    branches: [ main ]
    paths:
      - 'data/plantilla_preguntas_unica.csv'
      - 'tools/build_data.py'
  schedule:
    # Sincronización automática diaria a las 06:00 UTC (07:00/08:00 hora España)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar CSV y regenerar data.js y meta.json
        env:
          # Opcional: define la variable GOOGLE_SHEET_CSV_URL en Settings -> Secrets and variables -> Actions
          GOOGLE_SHEET_CSV_URL: ${{ vars.GOOGLE_SHEET_CSV_URL }}
        run: python tools/build_data.py

      - name: Guardar cambios si el banco se actualizó
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plantilla_preguntas_unica.csv data/data.js data/meta.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el banco de preguntas."
          else
            git commit -m "chore(data): sincronización automática del banco de preguntas"
            git push
          fi
