name: Sincronizar y generar preguntas automáticamente

on:
  push:
    branches: [ main ]
    paths:
      - 'data/plantilla_preguntas_unica.csv'
      - 'tools/build_data.py'
      - 'tools/auto_generate_questions.py'
  schedule:
    # Sincronización automática diaria a las 06:00 UTC (07:00/08:00 hora España)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      max_protocols:
        description: 'Máximo de protocolos nuevos/modificados a procesar con IA en esta ejecución'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detectar cambios en Protocolo-Recep y generar preguntas con Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_PROTOCOLS_PER_RUN: ${{ github.event.inputs.max_protocols || '5' }}
        run: python tools/auto_generate_questions.py

      - name: Validar CSV y regenerar data.js y meta.json
        env:
          # Opcional: define la variable GOOGLE_SHEET_CSV_URL en Settings -> Secrets and variables -> Actions
          GOOGLE_SHEET_CSV_URL: ${{ vars.GOOGLE_SHEET_CSV_URL }}
        run: python tools/build_data.py

      - name: Guardar cambios si el banco se actualizó
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plantilla_preguntas_unica.csv data/sync_state.json data/data.js data/meta.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el banco de preguntas."
          else
            git commit -m "chore(data): generación y sincronización automática desde Protocolo-Recep"
            git push
          fi
